name: Release build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.0 (empty = build only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      archive: ${{ steps.version.outputs.archive }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $release = ./tools/release-version.ps1 -EventName $env:GITHUB_EVENT_NAME -RefType $env:GITHUB_REF_TYPE -RefName $env:GITHUB_REF_NAME -RequestedVersion $env:REQUESTED_VERSION
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT
          "archive=$($release.Archive)" >> $env:GITHUB_OUTPUT
          "publish=$($release.Publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Check release packaging helpers
        run: python3 tests/test-release-assets.py
      - name: Check release version resolver
        shell: pwsh
        run: ./tests/test-release-version.ps1

  windows:
    needs: version
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PGADM_CMAKE: cmake
      PGADM_NINJA: ninja
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download PostgreSQL 18
        shell: pwsh
        run: python tools/fetch-postgresql.py
      - name: Build Qt-free Release
        shell: cmd
        env:
          PGADM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: build-release.cmd -DPGADM_FLTK_TESTS=ON "-DPGADM_RELEASE_VERSION=%PGADM_RELEASE_VERSION%"
      - name: Check application and UI
        run: ctest --test-dir build/Release --output-on-failure
      - name: Install Inno Setup compiler
        shell: pwsh
        run: ./tools/install-inno-setup.ps1
      - name: Package portable ZIP and installer
        shell: pwsh
        env:
          PGADM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: ./tools/package-windows.ps1 -Version $env:PGADM_RELEASE_VERSION -InnoCompiler ./build/tools/inno-setup/ISCC.exe -TestInstaller
      - name: Upload portable build
        uses: actions/upload-artifact@v6
        with:
          name: pgadmin-jr-windows-x64
          path: |
            dist/${{ needs.version.outputs.archive }}
            dist/*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload packaging report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-packaging-report
          path: |
            build/Release/packaging-*/startup.txt
            build/Release/packaging-*/installer-build.txt
            build/Release/installer-test-*/*.log
            build/Release/installer-test-*/startup.txt
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux packages
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  macos:
    name: macOS DMG
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Publish versioned release
    needs: [version, windows, linux, macos]
    if: needs.version.outputs.publish == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: pgadmin-jr-*
          merge-multiple: true
          path: release
      - name: Publish release with all platform packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: ./tools/publish-release.sh release
