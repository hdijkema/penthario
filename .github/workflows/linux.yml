name: Linux packages

on:
  workflow_call:
    inputs:
      version:
        description: 'Validated numeric release version; empty builds development packages'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 0.2.0 (build only; does not publish)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  debian:
    name: Debian ${{ matrix.debian }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    container: debian:${{ matrix.debian }}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check native container architecture
        run: test "$(dpkg --print-architecture)" = '${{ matrix.platform.arch }}'
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential \
            cmake ninja-build pkg-config python3 libpq-dev libsecret-1-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev \
            libxfixes-dev libfontconfig1-dev libpango1.0-dev libpng-dev libjpeg-dev \
            dpkg-dev file fonts-dejavu-core xvfb xauth
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build, test and package
        shell: bash
        env:
          PGADM_RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/build-debian.sh
      - name: Install and check the actual package
        shell: bash
        run: |
          test "$(dpkg-deb --field ./dist/*.deb Architecture)" = '${{ matrix.platform.arch }}'
          apt-get install -y ./dist/*.deb
          for language in nl en de; do
            xvfb-run -a /usr/bin/pgadmin-jr --language "$language" \
              --settings-file "/tmp/package-$language.json" --startup-check \
              --startup-report "/tmp/package-$language.txt"
            test -s "/tmp/package-$language.txt"
          done
          command -v pg_dump pg_restore psql createdb dropdb
          dpkg -L pgadmin-jr
      - uses: actions/upload-artifact@v6
        with:
          name: pgadmin-jr-debian${{ matrix.debian }}-${{ matrix.platform.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: debian${{ matrix.debian }}-${{ matrix.platform.arch }}-reports
          path: |
            build/debian${{ matrix.debian }}/startup-*.txt
            build/debian${{ matrix.debian }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  flatpak:
    name: Flatpak x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb xauth ccache
          sudo flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-info --system flathub org.freedesktop.Sdk/x86_64/26.08
          sudo flatpak install --system --noninteractive -y flathub \
            org.freedesktop.Sdk/x86_64/26.08 org.freedesktop.Platform/x86_64/26.08
      - name: Set Flatpak application version
        env:
          PGADM_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 tools/prepare-flatpak.py --version "$PGADM_RELEASE_VERSION" \
            --output packaging/flatpak/build.json
      - name: Build Flatpak
        run: |
          xvfb-run -a flatpak-builder --repo=build/flatpak-repo --disable-rofiles-fuse \
            --force-clean --default-branch=stable --arch=x86_64 --ccache \
            build/flatpak-app packaging/flatpak/build.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            build/flatpak-repo pgadmin-jr-x86_64.flatpak io.github.hdijkema.AltPgAdmin stable
      - name: Check installed sandbox and client tools
        run: |
          sudo flatpak install --system --noninteractive -y pgadmin-jr-x86_64.flatpak
          mkdir -p build/flatpak-reports
          for language in nl en de; do
            xvfb-run -a flatpak run --env=FLTK_BACKEND=x11 io.github.hdijkema.AltPgAdmin \
              --language "$language" --settings-file "/tmp/smoke-$language.json" --startup-check \
              --startup-report "$GITHUB_WORKSPACE/build/flatpak-reports/startup-$language.txt"
            test -s "build/flatpak-reports/startup-$language.txt"
          done
          flatpak run --command=sh io.github.hdijkema.AltPgAdmin -ec \
            'for tool in pg_dump pg_restore psql createdb dropdb; do "$tool" --version; done'
          flatpak info --show-permissions io.github.hdijkema.AltPgAdmin
      - name: Name Flatpak package
        env:
          PGADM_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          mv pgadmin-jr-x86_64.flatpak "dist/pgadmin-jr${PGADM_RELEASE_VERSION:+-$PGADM_RELEASE_VERSION}-linux-x86_64.flatpak"
      - uses: actions/upload-artifact@v6
        with:
          name: pgadmin-jr-flatpak-x86_64
          path: dist/*.flatpak
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: flatpak-reports
          path: build/flatpak-reports/*.txt
          if-no-files-found: ignore
          retention-days: 14
