title: Penthario
alternate_name: [pgadmin-jr, pgadmin junior]
description: "Penthario, formerly pgadmin-jr (pgadmin junior), is a native alternative to pgAdmin 4 for everyday PostgreSQL work: SQL editing, database browsing, exports and maintenance."
social_image: /assets/penthario-workspace.png
url: https://hdijkema.github.io
baseurl: /penthario
repository_url: https://github.com/hdijkema/penthario
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
defaults:
  - scope:
      path: "**/*.md"
      type: pages
    values:
      layout: documentation
  - scope:
      path: "**/*.markdown"
      type: pages
    values:
      layout: documentation
  - scope:
      path: index.html
    values:
      layout: null
exclude:
  - assets/README.md
