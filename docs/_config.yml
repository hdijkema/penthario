title: pgadmin-jr
description: A focused native desktop application for PostgreSQL. Write SQL, browse databases, export results and take care of everyday administration.
social_image: /assets/pgadmin-jr-workspace.png
url: https://hdijkema.github.io
baseurl: /pgadmin-jr
repository_url: https://github.com/hdijkema/pgadmin-jr
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
defaults:
  - scope:
      path: "**/*.md"
      type: pages
    values:
      layout: documentation
  - scope:
      path: "**/*.markdown"
      type: pages
    values:
      layout: documentation
  - scope:
      path: index.html
    values:
      layout: null
exclude:
  - assets/README.md
