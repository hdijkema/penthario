title: Penthario
description: "Penthario — The Master of Relations. A lightweight PostgreSQL administration tool. Less machinery. More magic. SQL editing, database browsing, exports and maintenance."
social_image: /assets/penthario-workspace.png
url: https://hdijkema.github.io
baseurl: /penthario
repository_url: https://github.com/hdijkema/penthario
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
defaults:
  - scope:
      path: "**/*.md"
      type: pages
    values:
      layout: documentation
  - scope:
      path: "**/*.markdown"
      type: pages
    values:
      layout: documentation
  - scope:
      path: index.html
    values:
      layout: null
exclude:
  - assets/README.md
